[pytest]
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
# Coverage is measured on the shipped modules only -- counting tests/ would
# inflate the number with code that never runs in production.
addopts =
    --cov=proxy_defense
    --cov=proxy_harvester
    --cov=mcp_proxy_server
    --cov-report=term-missing:skip-covered
