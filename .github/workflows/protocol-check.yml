on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  protocol-check:
    name: Protocol escalation + credential guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod +x .github/scripts/ci-check.sh
          .github/scripts/ci-check.sh
      - name: No broad exception handler swallows silently
        run: python .github/scripts/check-swallows.py

  skills:
    name: Skill packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate SKILL.md frontmatter
        run: python .github/scripts/check-skills.py

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit + integration tests (coverage floor 70%)
        run: python -m pytest -q --cov-fail-under=70
      - name: MCP protocol selftest
        run: python mcp_proxy_server.py --selftest

  installer:
    name: Installer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install into a throwaway HOME
        env:
          OWL_HOME: ${{ runner.temp }}/owl-agent
          PYTHON: python
        run: |
          chmod +x install-owl.sh scripts/verify-install.py
          ./install-owl.sh --no-live
      - name: Re-run installer (idempotency)
        env:
          OWL_HOME: ${{ runner.temp }}/owl-agent
          PYTHON: python
          OWL_SKIP_VERIFY: "1"
        run: ./install-owl.sh
      - name: Verify existing install
        env:
          OWL_HOME: ${{ runner.temp }}/owl-agent
        run: ./install-owl.sh --verify-only --no-live

  arch:
    name: Arch Linux / omArchy (pacman)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Prepare container (checkout needs git; arch image ships none)
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v4
      - name: System packages + install + verify
        env:
          OWL_HOME: /tmp/owl-agent
        run: |
          chmod +x scripts/install-arch.sh install-owl.sh
          set +e
          ./scripts/install-arch.sh --ci --minimal --no-live 2>&1 | tee arch-install.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::install-arch.sh exited $status"
            # Action logs are not always reachable (sandboxed reviewers, restricted
            # egress). Annotations are, so surface the tail of the output there.
            tail -n 30 arch-install.log | while IFS= read -r line; do
              [ -n "$line" ] && printf '::error::%s\n' "$line"
            done
          fi
          exit "$status"
      - name: Re-run installer (idempotency)
        env:
          OWL_HOME: /tmp/owl-agent
          OWL_SKIP_VERIFY: "1"
        run: ./scripts/install-arch.sh --ci --minimal --no-live
      - name: Verify existing install
        env:
          OWL_HOME: /tmp/owl-agent
        run: ./install-owl.sh --verify-only --no-live

  pkgbuild:
    name: PKGBUILD (Arch package)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tooling
        run: |
          pacman -Sy --noconfirm --needed git base-devel python \
            python-build python-installer python-wheel python-setuptools
      - uses: actions/checkout@v4
      - name: Build source tarball from this commit
        run: bash packaging/make-source.sh
      - name: Check dependency names resolve
        run: |
          # depends() names drift across rolling releases. Report a rename
          # rather than shipping a package that cannot be installed.
          deps=$(sed -n '/^depends=(/,/^)/p' packaging/PKGBUILD \
                 | grep -o "'[^']*'" | tr -d "'" | grep -v '\[' || true)
          missing=0
          for d in $deps; do
            if pacman -Si "$d" >/dev/null 2>&1; then
              echo "ok: $d"
            else
              echo "::warning title=dependency not in repos::$d"
              missing=$((missing + 1))
            fi
          done
          echo "unresolved dependency names: $missing (informational)"
      - name: Build the package (makepkg refuses to run as root)
        run: |
          useradd -m builder
          chown -R builder:builder .
          su -s /bin/bash builder -c 'cd packaging && makepkg -f --nodeps'
      - name: Assert the packaged payload
        run: |
          pkg=$(ls packaging/*.pkg.tar.zst)
          pacman -Qlp "$pkg" > contents.txt
          cat contents.txt
          fail=0
          for path in usr/bin/owl-proxy usr/bin/owl-proxy-mcp \
                      proxy_defense.py proxy_harvester.py mcp_proxy_server.py \
                      usr/share/licenses/owl-agent-proxy/LICENSE; do
            if grep -q "${path}$" contents.txt; then
              echo "present: $path"
            else
              echo "::error title=missing from package::$path"
              fail=1
            fi
          done
          # A venv-contaminated build would land under the venv prefix instead
          # of /usr/lib/pythonX.Y/site-packages.
          if grep -q '\.venv/' contents.txt; then
            echo "::error title=venv leak::package contains paths from a virtualenv"
            fail=1
          fi
          exit $fail
