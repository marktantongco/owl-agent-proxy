[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owl-agent-proxy"
version = "7.1.0"
description = "Layered HTTP defense stack: cache, dedupe, per-domain rate limit, sticky proxy rotation, honeypot detection and a stdio MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "marktantongco" }]
keywords = ["proxy", "http", "mcp", "agent", "scraping", "rotation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
]
# Mirrors requirements.txt. Distro packages (and the Arch PKGBUILD) resolve
# these through the system package manager instead; these bounds exist so that
# `pip install .` behaves like `pip install -r requirements.txt`.
dependencies = [
    "aiohttp>=3.11.18",
    "aiohttp-socks>=0.10.1",
    "aiofiles>=24.1.0",
    "cachetools>=5.5.2",
    "expiringdict>=1.2.2",
    "fake-useragent>=2.2.0",
    "httpx[socks]>=0.27,<0.29",
    "orjson>=3.10.16",
    "PySocks>=1.7.1",
    "PyYAML>=6.0.2",
    "python-dateutil>=2.9.0",
    "python-json-logger>=3.3.0",
    "requests[socks]>=2.32.3",
    "tenacity>=9.1.2",
    "urllib3>=2.4.0",
]

[project.optional-dependencies]
# The escalation ladder is optional by design: http/1.1 always works.
http2 = ["httpx[http2]>=0.28"]
ja3 = ["curl_cffi>=0.7"]
websocket = ["websockets>=15"]
redis = ["redis>=5"]
browser = ["playwright>=1.52"]
all = ["httpx[http2]>=0.28", "curl_cffi>=0.7", "websockets>=15", "redis>=5"]

[project.urls]
Homepage = "https://github.com/marktantongco/owl-agent-proxy"
Documentation = "https://github.com/marktantongco/owl-agent-proxy/blob/main/docs/MCP_INTEGRATION.md"
Issues = "https://github.com/marktantongco/owl-agent-proxy/issues"

[project.scripts]
owl-proxy = "proxy_defense:main"
owl-proxy-mcp = "mcp_proxy_server:main"

[tool.setuptools]
# Three top-level modules rather than a package: they are imported by name
# (proxy_defense, proxy_harvester, mcp_proxy_server) and the MCP server resolves
# the backend lazily from those names, so the layout is load-bearing.
py-modules = ["proxy_defense", "proxy_harvester", "mcp_proxy_server"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.template.json"]
