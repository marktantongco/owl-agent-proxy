# Nginx edge proxy for OWL Agent Governed Token Plane
#
# Runs in front of the gateway (127.0.0.1:20128).
# Provides: TLS termination, rate limiting, header forwarding, no provider key exposure.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limit zone: 10 requests per second per client IP
    limit_req_zone $binary_remote_addr zone=gateway:10m rate=10r/s;

    # Upstream gateway (local only — not exposed directly)
    upstream owl_gateway {
        server 127.0.0.1:20128;
        keepalive 32;
    }

    server {
        listen 443 ssl http2;
        server_name gateway.example.com;

        # TLS certificates (obtain via Let's Encrypt or provide your own)
        ssl_certificate     /etc/letsencrypt/live/gateway.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gateway.example.com/privkey.pem;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            # Rate limit: burst of 20, no delay
            limit_req zone=gateway burst=20 nodelay;

            # Forward to gateway
            proxy_pass http://owl_gateway;
            proxy_http_version 1.1;

            # Forward headers — client gets gateway token, not provider keys
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            # Timeouts
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;

            # No buffering (streaming responses)
            proxy_buffering off;

            # Hide upstream headers that could leak provider info
            proxy_hide_header X-Upstream-Provider;
            proxy_hide_header X-Provider-Key;
        }

        # Health check endpoint (no rate limit)
        location /health {
            proxy_pass http://owl_gateway;
            access_log off;
        }
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name gateway.example.com;
        return 301 https://$host$request_uri;
    }
}
